<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><meta name="description" content="Spleandour One: an offline-friendly personal dashboard."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Spleandour One</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#17141f;font:16px system-ui,sans-serif}p{padding:24px}</style></head><body><p id="status">Loading Spleandour One...</p><script>(async()=>{try{if(!window.DecompressionStream)throw Error('This browser cannot unpack the app. Please update your browser.');const files=['./app.bundle.part1.txt','./app.bundle.part3.txt','./app.bundle.part4.txt','./app.bundle.part2.txt'];const parts=await Promise.all(files.map(async file=>{const response=await fetch(file);if(!response.ok)throw Error('App files could not be downloaded.');return response.text()}));const bytes=Uint8Array.from(atob(parts.join('').replace(/\s/g,'')),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(error){document.querySelector('#status').textContent=error.message+' Connect to the internet and refresh.';console.error(error)}})()</script></body></html>
